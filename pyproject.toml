[project]
name = "jev-runner"
version = "0.1.0"
description = "Daemon + MCP tools that run TypeSafe's Jev agent on Mac Chrome and Android apps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git",
    "mcp[cli]>=2.2,<3",
    "uiautomator2>=3.7.1",
    "zeroconf>=0.151.5",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
